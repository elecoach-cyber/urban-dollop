<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Coaching da Elena</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            margin-bottom: 40px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; }
        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Coaching Professionale</h1>
            <p>Benvenuto nel tuo percorso strutturato di crescita. Scegli l'opzione di sessione qui sotto per iniziare.</p>
        </header>
        <div class="card">
            <h2>Pronto per Iniziare?</h2>
            <p>Scegli tra una singola sessione mirata o un pacchetto di sessioni multiple personalizzato in base ai tuoi obiettivi.</p>
            <a href="book.html" class="btn">Pianifica il Coaching</a>
        </div>
    </div>
</body>
</html>
