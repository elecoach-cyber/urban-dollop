<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Tech Laboratory</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981; /* Green accent for the lab vibe */
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            margin-bottom: 40px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; }
        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 Public Tech Laboratory</h1>
            <p>Weekend mode is active. Dive into open-source experimentation, tech teardowns, and live hardware sessions.</p>
        </header>
        <div class="card">
            <h2>Reserve a Lab Slot</h2>
            <p>Grab a spot for this weekend's open testing environment.</p>
            <!-- Embed TidyCal or lab booking link here -->
            <a href="#" class="btn">Book Lab Session</a>
        </div>
    </div>
</body>
</html>
